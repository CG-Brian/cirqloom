name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Python analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: analysis/pyproject.toml

      - name: Install analysis package
        run: pip install -e "analysis[dev]"

      - name: Lint
        working-directory: analysis
        run: ruff check .

      - name: Test
        working-directory: analysis
        run: pytest

      - name: Rebuild fixture bundle
        run: python analysis/scripts/build_fixture_bundle.py

      - name: Validate fixture bundle
        run: python analysis/scripts/validate_bundle.py data/fixtures/gpt2-small-demo

      - name: Validate committed GPT-2 bundle (not rebuilt in CI; needs model weights)
        run: python analysis/scripts/validate_bundle.py data/bundles/gpt2-small

      - name: Committed fixture matches a fresh build
        run: |
          git status --porcelain data/
          git diff --exit-code data/
          test -z "$(git status --porcelain data/)"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
